<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stacy Keago | Data Portfolio</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-R71825VDTK"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-R71825VDTK');
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --pink-bg: #E8C5D8;
            --pink-card: #F4DFEA;
            --green-bg: #2D4A27;
            --green-card: #233B1E;
            --text-dark: #2D4A27;
            --text-light: #F4DFEA;
            --accent-gold: #D4AF37;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--pink-bg);
            color: var(--text-dark);
            overflow-x: hidden;
            line-height: 1.6;
        }

        h1, h2, h3, .serif-font {
            font-family: 'Playfair Display', serif;
            letter-spacing: -0.5px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(232, 197, 216, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(45, 74, 39, 0.15);
            transition: all 0.3s ease;
        }

        .navbar.green-mode {
            background: rgba(45, 74, 39, 0.95);
            border-bottom: 1px solid rgba(244, 223, 234, 0.15);
        }

        .logo {
            font-size: 2.4rem !important;
            font-weight: 700;
            color: var(--green-bg);
            text-decoration: none;
            transition: color 0.3s;
        }

        .navbar.green-mode .logo, .navbar.green-mode .nav-links a {
            color: var(--text-light);
        }

        .nav-links {
            display: flex;
            gap: 36px;
            list-style: none;
        }

        .nav-links a {
            color: var(--green-bg);
            text-decoration: none;
            font-weight: 700;
            font-size: 1.2rem !important;
            transition: opacity 0.3s;
        }

        .nav-links a:hover {
            opacity: 0.7;
        }

        /* REDUCED PADDING SECTION STYLES */
        .section-pink {
            background-color: var(--pink-bg);
            color: var(--text-dark);
            padding: 90px 8% 40px;
        }

        .section-green {
            background-color: var(--green-bg);
            color: var(--text-light);
            padding: 60px 8% 40px;
        }

        .section-header {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 35px;
            text-transform: uppercase;
        }

        /* REDUCED WHITESPACE HERO SECTION */
        #home {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: auto;
            padding-top: 30px;
            padding-bottom: 20px;
            gap: 40px;
        }

        .hero-text h1 {
            font-size: 3.5rem;
            margin-bottom: 12px;
            line-height: 1.1;
        }

        .hero-text p {
            font-size: 1.15rem;
            margin-bottom: 20px;
            max-width: 580px;
        }

        .profile-img-container img {
            width: 280px;
            height: 280px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid var(--green-bg);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .social-buttons {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .btn-icon {
            width: 60px !important;
            height: 60px !important;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 2rem !important;
            color: #ffffff !important;
            transition: all 0.3s ease;
            box-shadow: 0 6px 18px rgba(0,0,0,0.25);
        }

        .btn-icon.linkedin { background-color: #0A66C2 !important; }
        .btn-icon.github { background-color: #181717 !important; }
        .btn-icon.hackerrank { background-color: #2EC4B6 !important; }

        .btn-icon:hover {
            transform: translateY(-4px) scale(1.08);
            box-shadow: 0 10px 22px rgba(0,0,0,0.35);
        }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <a href="#" class="logo serif-font">Stacy Keago</a>
        <ul class="nav-links">
            <li><a href="#home">About</a></li>
            <li><a href="#education">Education</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <section class="section-pink" id="home">
        <div class="hero-text">
            <h1 class="serif-font">Hello, I'm Stacy! 👋</h1>
            <p>I am a passionate <strong>Data Scientist & Analyst</strong> currently pursuing my Master's in Data Analytics in Berlin. I specialize in uncovering strategic insights from complex datasets.</p>
            
            <div class="social-buttons">
                <a href="https://www.linkedin.com/in/moraas/" target="_blank" class="btn-icon linkedin" title="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                <a href="https://github.com/stacykeago" target="_blank" class="btn-icon github" title="GitHub"><i class="fab fa-github"></i></a>
                <a href="https://www.hackerrank.com/profile/Kstacy" target="_blank" class="btn-icon hackerrank" title="HackerRank"><i class="fab fa-hackerrank"></i></a>
            </div>
        </div>

        <div class="profile-img-container">
            <img src="photo.jpg" alt="Stacy Keago">
        </div>
    </section>
</body>
</html>
